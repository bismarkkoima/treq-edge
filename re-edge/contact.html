<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Treq Store</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: #000;
            color: #fff;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        .nav-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            background: #363030;
            padding: 15px;
        }

        .nav-bar a {
            text-decoration: none;
            color: white;
            font-size: 18px;
            padding: 10px;
            background: #273817;
            border-radius: 5px;
        }

        .nav-bar a:hover {
            background: #a40000;
        }

        h1 {
            font-size: 36px;
            margin-top: 20px;
        }

        .contact-form {
            width: 60%;
            margin: auto;
            background: #111;
            padding: 20px;
            border-radius: 10px;
            text-align: left;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
            font-size: 16px;
        }

        button {
            background-color: #273817;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
        }

        button:hover {
            background-color: rgb(67, 158, 55);
        }

        footer {
            margin-top: 20px;
            padding: 10px;
            background: #222;
        }
    </style>
</head>
<body>

    <header>
        <h1>Contact Us</h1>
    </header>

    <div class="nav-bar">
        <a href="final3.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="women.html">Women</a>
        <a href="men.html">Men</a>
        <a href="collections.html">Collections</a>
        <a href="cart.html">Cart</a>
    </div>

    <section class="contact-form">
        <h2>Tuambie</h2>
        <form>
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <textarea placeholder="Your Message" rows="4" required></textarea>
            <button type="submit">Send Message</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2025 Treq Store. All rights reserved.</p>
    </footer>
