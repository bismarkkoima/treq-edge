<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Men's Collection - Treq Store</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: black;
            color: rgb(255, 255, 255);
            text-align: center;
        }

        .nav-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            background: #363030;
            color: #ffffff;
            padding: 15px;
        }

        .nav-bar a {
            text-decoration: none;
            color: white;
            font-size: 18px;
            background:  #004109;
            padding: 10px 15px;
            border-radius: 5px;
        }

        .nav-bar a:hover {
            background: #870000;
        }

        .search-bar {
            margin: 20px auto;
            width: 50%;
            display: flex;
            justify-content: center;
        }

        .search-bar input {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: none;
            font-size: 16px;
        }

        .product img {
            width: 300px;
            height: 300px; 
            object-fit: cover; 
            border-radius: 10px;
        }

        .product {
            display: inline-block;
            margin: 20px;
            text-align: center;
        }

        button {
            background-color: #ffffff;
            color: rgb(0, 0, 0);
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #e5e8eb;
        }
    </style>
</head>
<body>
    <header>
        <h1>Men's Collection</h1>
    </header>
    
    <div class="nav-bar">
      <a href="final3.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="women.html">Women</a>
      <a href="men.html">Men</a>
      <a href="collections.html">Collections</a>
      <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
    </div>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search..." onkeyup="searchProducts()">
    </div>

    <section>
        <h1>Men's Collections</h1>
        <p>Keep up to date with modern fashion.</p>
    </section>

    <section id="product-list">
        <h2>Bidhaa</h2>
        <div class="product">
            <img src="https://www.timberland.com.sg/wp-content/uploads/product/f23/A5RJD231-HERO-768x768.jpg" alt="Timberland Shoes">
            <h3>Timberland Shoes</h3>
            <p>Ksh. 75,500</p>
            <button onclick="addToCart('Timberland Shoes', 75500, 'https://www.timberland.com.sg/wp-content/uploads/product/f23/A5RJD231-HERO-768x768.jpg')">Add to Cart</button>
        </div>

        <div class="product">
            <img src="https://y2k-wave.com/cdn/shop/files/4_1091c7fe-e3e9-4ab7-aa5b-e8f3c927a999.png?v=1699029177" alt="Mea Culpa Beanie">
            <h3>Mea Culpa Beanie</h3>
            <p>Ksh.500</p>
            <button onclick="addToCart('Mea Culpa Beanie', 500, 'https://y2k-wave.com/cdn/shop/files/4_1091c7fe-e3e9-4ab7-aa5b-e8f3c927a999.png?v=1699029177')">Add to Cart</button>
        </div>

        <div class="product">
            <img src="https://www.zaqq.com/cdn/shop/files/2_4b49ffdd-de3c-43c6-8312-0ef8aa1ce427.jpg?v=1731746721&width=1445" alt="Treq Store Shoes">
            <h3>Treq Sneakers</h3>
            <p>Ksh.10,200</p>
            <button onclick="addToCart('Treq Sneakers', 10200, 'https://www.zaqq.com/cdn/shop/files/2_4b49ffdd-de3c-43c6-8312-0ef8aa1ce427.jpg?v=1731746721&width=1445')">Add to Cart</button>
        </div>

        <div class="product">
            <img src="https://static.wixstatic.com/media/29e227_3c0017babead4168acfbf4e6fb5a7ee4~mv2.jpg/v1/fill/w_480,h_452,al_c,q_80,usm_0.66_1.00_0.01,enc_avif,quality_auto/29e227_3c0017babead4168acfbf4e6fb5a7ee4~mv2.jpg" alt="Okala">
            <h3>Okala</h3>
            <p>Ksh.150</p>
            <button onclick="addToCart('Okala', 150, 'https://static.wixstatic.com/media/29e227_3c0017babead4168acfbf4e6fb5a7ee4~mv2.jpg')">Add to Cart</button>
        </div>
    </section>

    <footer>
        <p>&copy; 2025 Treq Store. All rights reserved.</p>
    </footer>

    <script>
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        document.getElementById('cart-count').innerText = cart.length;

        function addToCart(name, price, image) {
            let existingItem = cart.find(item => item.name === name);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ name, price, quantity: 1, image });
            }
            localStorage.setItem("cart", JSON.stringify(cart));
            document.getElementById('cart-count').innerText = cart.length;
            alert(`${name} added to cart!`);
        }

        function searchProducts() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let products = document.querySelectorAll('.product');
            products.forEach(product => {
                let title = product.querySelector('h3').innerText.toLowerCase();
                if (title.includes(input)) {
                    product.style.display = "inline-block";
                } else {
                    product.style.display = "none";
                }
            });
        }
    </script>
</body>
</html>
