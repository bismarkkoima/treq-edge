<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treq Store</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            font-size: large;
            background-color: black;
            color: white;
            text-align: center;
        }

        .nav-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            background: #363030;
            color: #ffffff;
            padding: 15px;
        }

        .nav-bar a {
            text-decoration: none;
            color: white;
            font-size: 18px;
            padding: 10px;
            background: #273817;
            border-radius: 5px;
        }

        .nav-bar a:hover {
            background: #000000;
        }

        .search-container {
            position: relative;
            width: 300px;
            margin: auto;
        }

        .search-box {
            width: 100%;
            padding: 2px;
            border: 8px solid #ffffff;
            border-radius: 5px;
            outline: none;
            font-size: 16px;
        }

        .search-button {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            cursor: pointer;
            font-size: 18px;
        }

        header {
            font-size: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
        }

        .product img {
            width: 300px;
            border-radius: 10px;
        }

        .gps-button, .contact-button, .help-button, .back-button {
            background-color: #273817;
            color: #ffffff;
            height: 40px;
            width: 130px;
            border-radius: 2px;
            border-width: 2px;
            cursor: pointer;
            font-weight: bold;
            margin: 20px;
        }

        .gps-button:hover, .contact-button:hover, .help-button:hover, .back-button:hover {
            background-color: rgb(67, 158, 55);
        }
    </style>
</head>
<body>

<header>
    <h1>TREQ STORE</h1>
    <button class="gps-button" onclick="getLocation()
    "> My Location</button>
</header>

<div class="nav-bar">
    <a href="final3.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="women.html">Women</a>
    <a href="men.html">Men</a>
    <a href="collections.html">Collections</a>
    <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
</div>

<div class="search-container">
    <input type="text" class="search-box" id="search" placeholder="Search...">
    <button class="search-button" onclick="searchFunction()">?</button>
</div>

<section>
    <h2>Nguo za Bei Nafuu!!</h2>
    <p>Discover the latest Treq Store collections.</p>
    <button>Shop Now</button>
</section>

<section>
    <h2>Featured Products</h2>
    <div class="product">
        <img src="https://5.imimg.com/data5/SELLER/Default/2023/11/363761195/FK/YL/MC/188692646/881d463b-d215-44c2-b975-61da4b959f4a-1000x1000.webp" alt="Treq Leather Bag">
        <h3>Treq Leather Bag</h3>
        <p>Ksh. 1500</p>
        <button onclick="addToCart('Treq Leather Bag', 1500, 'https://5.imimg.com/data5/SELLER/Default/2023/11/363761195/FK/YL/MC/188692646/881d463b-d215-44c2-b975-61da4b959f4a-1000x1000.webp')">Add to Cart</button>
    </div>
    
    <div class="product">
        <img src="https://www.timberland.com.sg/wp-content/uploads/product/f23/A5RJD231-HERO-768x768.jpg" alt="Timberland Shoes">
        <h3>Timberland Shoes</h3>
        <p>Ksh. 75,500</p>
        <button onclick="addToCart('Timberland Shoes', 75500, 'https://www.timberland.com.sg/wp-content/uploads/product/f23/A5RJD231-HERO-768x768.jpg')">Add to Cart</button>
    </div>
</section>

<a href="contact.html"><button class="contact-button">CONTACT US</button></a>
<a href="help.html"><button class="help-button">Help</button></a>
<a href="final3.html"><button class="back-button">Back to Home</button></a>

<footer>
    <p>&copy; 2025 Treq Store. All rights reserved.</p>
</footer>

<script>
    function searchFunction() {
        let query = document.getElementById("search").value.toLowerCase();
        let products = document.querySelectorAll(".product");

        products.forEach(product => {
            let name = product.querySelector("h3").innerText.toLowerCase();
            product.style.display = name.includes(query) ? "block" : "none";
        });
    }

    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    document.getElementById('cart-count').innerText = cart.length;

    function addToCart(name, price, image) {
        let existingItem = cart.find(item => item.name === name);
        if (existingItem) {
            existingItem.quantity += 1;
        } else {
            cart.push({ name, price, image, quantity: 1 });
        }
        localStorage.setItem("cart", JSON.stringify(cart));
        document.getElementById('cart-count').innerText = cart.length;
        alert(`${name} added to cart!`);
    }

    function getLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(showPosition, showError);
        } else {
            alert("Geolocation is not supported by this browser.");
        }
    }

    function showPosition(position) {
        alert("Latitude: " + position.coords.latitude + 
              "\nLongitude: " + position.coords.longitude);
    }

    function showError(error) {
        switch(error.code) {
            case error.PERMISSION_DENIED:
                alert("User denied the request for Geolocation.");
                break;
            case error.POSITION_UNAVAILABLE:
                alert("Location information is unavailable.");
                break;
            case error.TIMEOUT:
                alert("The request to get user location timed out.");
                break;
            case error.UNKNOWN_ERROR:
                alert("An unknown error occurred.");
                break;
        }
    }
</script>

</body>
</html>
