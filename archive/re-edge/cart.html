<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treq Store - Shopping Cart</title>
    <style>
        body {
            font-family:'Times New Roman', Times, serif;
            font-size: large;
            background-color: black;
            color: white;
            text-align: center;
        }

        .nav-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            background: #363030;
            color: #ffffff;
            padding: 15px;
        }

        .nav-bar a {
            text-decoration: none;
            color: white;
            font-size: 18px;
            padding: 10px;
            background: #273817;
            border-radius: 5px;
        }

        .nav-bar a:hover {
            background: #880000;
        }

        .cart-container {
            padding: 20px;
            margin: 20px auto;
            width: 80%;
            background-color: #333;
            border-radius: 10px;
        }

        h2 {
            color: #ffff35;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        table th, table td {
            padding: 15px;
            text-align: center;
            border: 1px solid #ddd;
        }

        table th {
            background-color: #273817;
        }

        table td {
            background-color: #444;
        }

        button {
            background-color: #273817;
            color: white;
            border-radius: 5px;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
            border: none;
        }

        button:hover {
            background-color: rgb(67, 158, 55);
        }

        .total-container {
            margin-top: 20px;
            font-size: 1.2em;
            color: white;
        }

        .empty-cart {
            font-size: 1.5em;
            color: #fff;
            margin-top: 20px;
        }

        .cart-image {
            width: 100px;
            height: 100px;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <header>
        <h1>TREQ STORE</h1>
    </header>

    <div class="nav-bar">
        <a href="final3.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="women.html">Women</a>
        <a href="men.html">Men</a>
        <a href="collections.html">Collections</a>
        <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
    </div>

    <div class="cart-container">
        <h2>Your Shopping Cart</h2>
        <table id="cart-table">
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Total</th>
                    <th>Remove</th>
                </tr>
            </thead>
            <tbody id="cart-items"></tbody>
        </table>

        <div class="total-container">
            <p>Total: Ksh <span id="total-price">0</span></p>
        </div>

        <p id="empty-cart-message" class="empty-cart">Your cart is empty!</p>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            const cartCountElement = document.getElementById("cart-count");
            const cartItemsElement = document.getElementById("cart-items");
            const totalPriceElement = document.getElementById("total-price");
            const emptyCartMessage = document.getElementById("empty-cart-message");

            function updateCartDisplay() {
                cartItemsElement.innerHTML = "";
                let totalPrice = 0;

                if (cart.length === 0) {
                    emptyCartMessage.style.display = "block";
                } else {
                    emptyCartMessage.style.display = "none";
                }

                cart.forEach((item, index) => {
                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td><img src="${item.image}" alt="${item.name}" class="cart-image"></td>
                        <td>Ksh. ${item.price}</td>
                        <td>${item.quantity}</td>
                        <td>Ksh. ${item.price * item.quantity}</td>
                        <td><button onclick="removeFromCart(${index})">Remove</button></td>
                    `;
                    cartItemsElement.appendChild(row);
                    totalPrice += item.price * item.quantity;
                });

                totalPriceElement.innerText = totalPrice;
                cartCountElement.innerText = cart.length;
                localStorage.setItem("cart", JSON.stringify(cart));
            }

            window.removeFromCart = (index) => {
                cart.splice(index, 1);
                updateCartDisplay();
            };

            updateCartDisplay();
        });
    </script>
</body>
</html>
