<!DOCTYPE html>
<html lang="en">
<head>







    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treq Store</title>
    <style>



        body {
            font-family:'Times New Roman', Times, serif;
            font-size: large;
            background-color: black;
            color: white;
            text-align: center;
          
        }

        .nav-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            background: #333;
            
        }

        .nav-bar a {
            text-decoration: none;
            color: white;
            font-size: 18px;
            
            background: #446e19;
            border-radius: 5px;
           
        }

        .nav-bar a:hover {
            background: #ffff35;
        }

        header {
          
            font-size: 28px;
        }

        .product img {
            width: 300px;
            border-radius: 10px;
        }

        .contact-button {
            background-color: rgb(3, 81, 19);
            color: white;
            border: none;
            height: 40px;
            width: 130px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.15s;
            margin: 20px;
        }

        .contact-button:hover {
            background-color: red;
            opacity: 0.8;
        }

        .contact-button:active {
            background-color: rgb(43, 0, 255);
        }

        .help-button {
            height: 40px;
            width: 90px;
            border-radius: 4px;
            border-width: 2px;
            cursor: pointer;
            font-weight: bold;
            margin: 20px;
        }

        .help-button:hover {
            background-color: rgb(188, 232, 248);
        }
    </style>
</head>
<body>

    <header>
        <h1>TREQ STORE</h1>
    </header>

    <div class="nav-bar">
        <a href="#">Home</a>
        <a href="#">Shop</a>
        <a href="#">Collections</a>
        <a href="#">Cart (<span id="cart-count">0</span>)</a>
    </div>

    <section>
        <h2>Nguo za Bei Nafuu!!</h2>
        <p>Discover the latest Treq Store collections.</p>
        <button>Shop Now</button>
    </section>

    <section>
        <h2>Featured Products</h2>
        <div class="product">
            <img src="https://5.imimg.com/data5/SELLER/Default/2023/11/363761195/FK/YL/MC/188692646/881d463b-d215-44c2-b975-61da4b959f4a-1000x1000.webp" alt="Treq Leather Bag">
            <h3>Treq Leather Bag</h3>
            <p>Ksh. 1500</p>
            <button onclick="addToCart('Treq Leather Bag', 1500)">Add to Cart</button>
        </div>
        
        <div class="product">
            <img src="https://www.timberland.com.sg/wp-content/uploads/product/f23/A5RJD231-HERO-768x768.jpg" alt="Timberland Shoes">
            <h3>Timberland Shoes</h3>
            <p>Ksh. 75,500</p>
            <button onclick="addToCart('Timberland Shoes', 75500)">Add to Cart</button>
        </div>
        <div>
          <img src="https://y2k-wave.com/cdn/shop/files/4_1091c7fe-e3e9-4ab7-aa5b-e8f3c927a999.png?v=1699029177"
          alt="Mea Culpa Beanie" 
          width="300">
            <h3>Mea Culpa Beanie</h3>
            <p>Ksh.500</p>
            <button onclick="addToCart('Mea Culpa Beanie', 500)">Add to Cart</button>
            
             
        </div>
        <div>
          <img src="https://www.zaqq.com/cdn/shop/files/2_4b49ffdd-de3c-43c6-8312-0ef8aa1ce427.jpg?v=1731746721&width=1445" 
          alt="Treq Store Shoes" 
          width="300">
            <h3>Treq Sneakers</h3>
            <p>Ksh.10,200</p>
            <button onclick="addToCart('Treq Sneakers', 1200)">Add to Cart</button>
        </div>
    </section>

    <button class="contact-button">CONTACT US</button>
    <button class="help-button">Help</button>

    <footer>
        <p>&copy; 2025 Treq Store. All rights reserved.</p>
    </footer>

    <script>
        let cartCount = 0;
        function addToCart(product, price) {
            cartCount++;
            document.getElementById('cart-count').innerText = cartCount;
            alert(`${product} added to cart!`);
        }
    </script>
</body>
</html>
