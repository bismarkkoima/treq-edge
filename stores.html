<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store Locator — Treq Edge</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main class="container">
    <div class="page-title">
      <span class="eyebrow">Visit us</span>
      <h1>Store Locator</h1>
      <p>Find your nearest Treq Edge boutique and book an appointment with a client advisor.</p>
      <button class="btn" style="margin-top:24px" onclick="locate()" id="locate-btn">Use my location</button>
      <p class="muted" id="location-info" style="margin-top:12px"></p>
    </div>

    <div class="two-col">
      <div class="store-list" id="stores"></div>
      <iframe class="map-frame" id="map" title="Store map" loading="lazy"
        src="https://maps.google.com/maps?q=-1.2864,36.8172&z=11&output=embed"></iframe>
    </div>
  </main>

  <script src="assets/js/products.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    const STORES = [
      { name: "Nairobi — Westlands", address: "The Sarit Centre, Ground Floor", lat: -1.2610, lng: 36.8025, hours: "Mon–Sat 10:00–20:00" },
      { name: "Nairobi — CBD", address: "Kenyatta Avenue, Treq House", lat: -1.2864, lng: 36.8222, hours: "Mon–Sat 09:00–19:00" },
      { name: "Mombasa — Nyali", address: "City Mall, Level 1", lat: -4.0283, lng: 39.7186, hours: "Daily 10:00–21:00" },
      { name: "Kisumu", address: "Mega Plaza, Oginga Odinga St", lat: -0.1022, lng: 34.7617, hours: "Mon–Sat 09:00–18:00" },
      { name: "Eldoret", address: "Rupa Mall, Ground Floor", lat: 0.5143, lng: 35.2698, hours: "Mon–Sat 09:00–18:00" }
    ];

    function distanceKm(a, b) {
      const toRad = d => d * Math.PI / 180;
      const dLat = toRad(b.lat - a.lat), dLng = toRad(b.lng - a.lng);
      const h = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng / 2) ** 2;
      return 6371 * 2 * Math.asin(Math.sqrt(h));
    }

    function showOnMap(lat, lng) {
      document.getElementById("map").src = `https://maps.google.com/maps?q=${lat},${lng}&z=15&output=embed`;
    }

    function renderStores(origin) {
      const list = STORES.map(s => ({ ...s, dist: origin ? distanceKm(origin, s) : null }));
      if (origin) list.sort((a, b) => a.dist - b.dist);
      document.getElementById("stores").innerHTML = list.map(s => `
        <div class="store">
          <div>
            <h3>${s.name}</h3>
            <p class="muted">${s.address}</p>
            <p class="muted">${s.hours}</p>
            ${s.dist !== null ? `<p class="dist">${s.dist.toFixed(1)} km away</p>` : ""}
          </div>
          <div class="stack">
            <button class="btn-line" onclick="showOnMap(${s.lat}, ${s.lng})">Map</button>
            <a class="btn-line" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}">Directions</a>
          </div>
        </div>`).join("");
    }

    function locate() {
      const info = document.getElementById("location-info");
      if (!navigator.geolocation) {
        info.textContent = "Geolocation is not supported by this browser.";
        return;
      }
      info.textContent = "Locating you…";
      navigator.geolocation.getCurrentPosition(pos => {
        const origin = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        info.textContent = `Showing stores nearest to ${origin.lat.toFixed(4)}, ${origin.lng.toFixed(4)}`;
        renderStores(origin);
        showOnMap(origin.lat, origin.lng);
      }, err => {
        const messages = {
          1: "Location permission was denied.",
          2: "Location information is unavailable.",
          3: "The location request timed out."
        };
        info.textContent = messages[err.code] || "An unknown error occurred.";
      });
    }

    renderStores();
  </script>
</body>
</html>
